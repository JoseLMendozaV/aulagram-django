<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AulaGram{% endblock %}</title>
    <!-- Tailwind por CDN mantiene esta version educativa sin Node ni compilacion. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { 500: '#d946ef', 600: '#c026d3' } } } }
        }
    </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
    <nav class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 backdrop-blur">
        <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
            <a href="{% url 'posts:home' %}" class="text-2xl font-black tracking-tight">
                Aula<span class="text-fuchsia-600">Gram</span>
            </a>
            {% if user.is_authenticated %}
                <div class="flex items-center gap-2 sm:gap-4">
                    <a href="{% url 'posts:feed' %}" class="rounded-lg px-3 py-2 text-sm font-semibold hover:bg-slate-100">Inicio</a>
                    <a href="{% url 'posts:create' %}" class="rounded-lg bg-fuchsia-600 px-3 py-2 text-sm font-semibold text-white hover:bg-fuchsia-700">Publicar</a>
                    {% if user.can_manage_users %}
                        <a href="{% url 'accounts:user_list' %}" class="hidden rounded-lg px-3 py-2 text-sm font-semibold hover:bg-slate-100 sm:block">Usuarios</a>
                    {% endif %}
                    <a href="{% url 'accounts:profile' user.username %}" class="text-sm font-bold">@{{ user.username }}</a>
                    <form method="post" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}
                        <button class="text-sm text-slate-500 hover:text-slate-900">Salir</button>
                    </form>
                </div>
            {% endif %}
        </div>
    </nav>

    {% if messages %}
        <div class="mx-auto max-w-2xl px-4 pt-4">
            {% for message in messages %}
                <div class="mb-2 rounded-xl border px-4 py-3 text-sm {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-800{% else %}border-emerald-200 bg-emerald-50 text-emerald-800{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <main class="mx-auto max-w-5xl px-4 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
